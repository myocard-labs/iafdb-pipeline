# IAFDB healthy-segment bank — percentile (scale-invariant) selection.
#
# The alternative to an absolute mV cutoff. A percentile threshold is computed
# per record over that record's own pooled peak-to-peak distribution, so the
# same setting is a different mV cut in every record.
#
# When to prefer it: an absolute cutoff assumes calibration succeeded and that
# one mV number is meaningful across every record. A percentile makes no such
# assumption — it keeps "the loudest N% of this record" regardless of scale,
# which is the honest choice when comparing records whose amplitudes differ for
# acquisition reasons rather than physiological ones.
#
# The trade: the retained fraction is fixed by construction, so a record with
# no genuinely high-voltage tissue still contributes its top slice.

data:
  data_dir: ../data/iafdb
  output:   ../banks/iafdb_healthy_p70.h5

format:
  type: iafdb

threshold:
  mode:  percentile
  value: 70.0                              # 0..100; keep windows above this percentile

windowing:
  window_ms: 512.0
  hop_ms:    256.0

calibration:
  # REQUIRED, no default — the choice must be written down.
  #
  # `none`: traces are emitted in the recorded nominal mV, unscaled. This is
  # what research recommends as the honest default. R-wave anchoring — the
  # alternative — was ruled NON-STANDARD FOR EGM (2026-08-09): it normalizes
  # an intracardiac signal by a surface-ECG QRS amplitude, which is a category
  # error as physiology and survives only under a shared amplifier-gain
  # premise that is unverified on IAFDB. See project/architecture.md ->
  # "Calibration", and examples/iafdb_healthy_default.yaml for the case where
  # anchoring is still the right call.
  #
  # Consequence to keep in mind: nominal mV is internally consistent WITHIN a
  # record and not comparable ACROSS records, so amplitude selection here
  # should be scale-invariant (threshold.mode: percentile) rather than a fixed
  # mV cut. Setting `mode: absolute` alongside this warns for that reason.
  #
  # In this config specifically: a percentile cut is scale-invariant, so this is the recommended pairing end to end.
  method: none
