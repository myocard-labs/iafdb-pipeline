# IAFDB bank + a paired ClassifierBank, labeled all-healthy.
#
# format.type: classifier writes the iafdb_bank.h5 as usual AND converts it to
# a ClassifierBank.h5, applying a label policy on the way.
#
# `all-healthy` labels every trace 0. Use it only when the selection itself is
# the claim — a high-voltage-thresholded bank being treated as the healthy
# class. It is NOT the honest policy for IAFDB in general: the dataset carries
# no per-segment fibrosis truth, so asserting "healthy" is a modelling choice,
# not a fact. See iafdb_classifier_unlabeled.yaml for the alternative.

data:
  data_dir: ../data/iafdb
  output:   ../banks/iafdb_healthy_v1.h5   # the iafdb_bank.h5 is still written

format:
  type: classifier
  label_policy: all-healthy                # all-healthy | unlabeled

  # Where the ClassifierBank sibling goes. Omit it and the producer derives
  # <output>.classifier.h5; set it when the two artifacts want different names
  # or directories — e.g. keeping training inputs beside a training run.
  classifier_output: ../banks/iafdb_healthy_v1_train.classifier.h5

threshold:
  mode:  absolute
  value: 0.2

windowing:
  window_ms: 512.0
  hop_ms:    256.0

calibration:
  target_qrs_pp_mv: 1.0
