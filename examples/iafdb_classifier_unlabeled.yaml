# IAFDB bank + a paired ClassifierBank with NO ground truth.
#
# The honest policy for IAFDB, and now the DEFAULT — a config that says
# nothing about labels produces a bank like this one.
#
# IAFDB carries no per-segment fibrosis labels — nobody annotated this data for
# the thing we are trying to predict. `unlabeled` says so: every `label_truth`
# is left None and the labels dict is empty. A bank in this shape is inference
# input, not training data; an eval run over it produces an unlabeled (`upred_`)
# predictions bank, and any result read off it is a directional, label-free
# observation rather than a scored metric. No AUROC, no confusion matrix — there
# is nothing to score against.
#
# Contrast iafdb_classifier.yaml, which asserts all-healthy and carries a
# warning about why that assertion is unproven for this dataset.

data:
  data_dir: ../data/iafdb
  output:   ../banks/iafdb_inference_v1.h5   # the iafdb_bank.h5 is still written

format:
  type: classifier
  label_policy: unlabeled                    # the default; spelled out here for clarity

threshold:
  # Percentile, not a fixed mV cut, because calibration below is `none`:
  # uncalibrated amplitudes are comparable within a record but not across
  # them, so an absolute mV threshold would select a different tier in every
  # record. (Pairing `absolute` with `method: none` is allowed but warns.)
  mode:  percentile
  value: 70.0                                # 0..100; keep windows above this

windowing:
  window_ms: 512.0
  hop_ms:    256.0

calibration:
  # REQUIRED, no default — the choice must be written down.
  #
  # `none`: traces are emitted in the recorded nominal mV, unscaled. This is
  # what research recommends as the honest default. R-wave anchoring — the
  # alternative — was ruled NON-STANDARD FOR EGM (2026-08-09): it normalizes
  # an intracardiac signal by a surface-ECG QRS amplitude, which is a category
  # error as physiology and survives only under a shared amplifier-gain
  # premise that is unverified on IAFDB. See project/architecture.md ->
  # "Calibration", and examples/iafdb_healthy_default.yaml for the case where
  # anchoring is still the right call.
  #
  # Consequence to keep in mind: nominal mV is internally consistent WITHIN a
  # record and not comparable ACROSS records, so amplitude selection here
  # should be scale-invariant (threshold.mode: percentile) rather than a fixed
  # mV cut. Setting `mode: absolute` alongside this warns for that reason.
  #
  # In this config specifically: the honest IAFDB shape: no labels, no calibration, scale-invariant selection.
  method: none
