# IAFDB healthy-segment bank — the annotated reference config.
#
# Start here. Every other example in this folder is this one with a single
# dimension changed, so the comments below are not repeated elsewhere.
#
# Emits fixed-length windows whose calibrated peak-to-peak clears a threshold:
# band-pass -> sliding peak-to-peak -> keep-above. Run with
#   iafdb-export-bank examples/iafdb_healthy_default.yaml

data:
  # Paths are resolved against THIS FILE's directory, not the working
  # directory, so the config works from wherever you run it.
  data_dir: ../data/iafdb                  # PhysioNet IAFDB download root
  output:   ../banks/iafdb_healthy_v1.h5   # bank destination (HDF5)

  # Optional stable cross-artifact id. Omit it and one is derived from the
  # bank's role and today's date (tbank_iafdb_<date>, or ptbank_ when
  # threshold.mode is none). Set it when you want a descriptive id a phase
  # manifest can reference; the form is lowercase role_descriptor_date.
  bank_id: tbank_iafdb_healthy_kosiuk_2026-06-27

format:
  type: iafdb                              # iafdb | classifier

threshold:
  mode:  absolute                          # absolute | percentile | none
  value: 0.2                               # mV cutoff, Kosiuk AF-adjusted
  # Alternative convention: value: 0.5 is Sánchez 2021's sinus-rhythm cutoff
  # (cf. Marchlinski 2000, Sanders 2003). IAFDB is AF-rhythm data, so 0.5 is
  # the stricter choice and yields far fewer segments — useful when comparing
  # directly against literature that uses the sinus-rhythm convention.

windowing:
  mode: sliding                            # sliding (default) | activation
  window_ms: 512.0
  hop_ms:    256.0
  band_hz: [30.0, 300.0]                   # clinical bipolar EGM band

calibration:
  # REQUIRED — there is no default and no way to omit this block.
  #
  # What it does: every emitted trace is multiplied by a per-record scalar
  # a_r = target_qrs_pp_mv / (median QRS peak-to-peak on a surface ECG lead).
  # It is the single largest transform this pipeline applies, and it is not
  # visible in the output — the bank stores the scaled signal, not the raw one.
  #
  # RULED NON-STANDARD FOR EGM (research, 2026-08-09). Two premises can be
  # offered for it, and only one survives:
  #   - Physiological covariation ("the surface R wave is a common reference")
  #     is a CATEGORY ERROR. Near-field atrial EGM amplitude and far-field
  #     surface QRS amplitude have no shared physiological driver.
  #   - Shared amplifier gain — if both channel sets carry one miscalibrated
  #     per-record gain, anchoring recovers THAT gain. Defensible, and the
  #     only premise worth stating. UNVERIFIED on IAFDB.
  #
  # The evidence: the scalar spans 5.4x across the corpus, so the step does
  # real work. Its free consistency check (four catheter placements of one
  # patient share a surface ECG, so should give one scalar) passes for 6 of 8
  # patients. It fails for 2 — including iaf4, the ONE patient whose ADC
  # gains are real and identical across all four of its records, which is
  # exactly where the shared-gain premise is checkable, and where it doesn't
  # hold (1.91x spread).
  #
  # `none` — raw values, scale-invariant processing — is the intended default
  # and is NOT YET WRITABLE: the iafdb_bank schema pins calibration_method to
  # a single-value enum, so an uncalibrated bank has no legal value to record
  # and would have to claim a calibration it never ran. Tracked in CL-154.
  # Prefer `none` here as soon as it lands.
  #
  # Full ruling: project/architecture.md -> "Calibration"; the review is
  # intracardiac-platform/project/investigations/rwave_anchoring_review.md.
  method: r_wave_anchoring

  # The scale the corpus lands on. Unlike `method` this one does default —
  # it only chooses units for a transform you have already opted into, and
  # is inert without it. 1.0 mV is what every bank on disk was built with.
  # Still the ONLY place in the constellation this value is defaulted:
  # egm-signal ships none and export_bank() requires it explicitly, so a
  # corpus cannot be calibrated to two different scales by entry point.
  target_qrs_pp_mv: 1.0
