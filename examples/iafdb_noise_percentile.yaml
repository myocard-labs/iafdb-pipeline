# IAFDB noise bank — the annotated reference for the noise producer.
#
# Run with: iafdb-export-noise-bank examples/iafdb_noise_percentile.yaml
#
# The mirror of the healthy producer: it keeps windows *below* a threshold
# rather than above one. The output feeds the synthetic-EGM mixer, which adds
# real recording noise to clean simulated traces — so what is wanted here is
# genuine inter-activation quiet, not signal.
#
# Two asymmetries against the healthy side, both deliberate:
#   - No calibration. The percentile default is scale-invariant, so calibrating
#     would be wasted work and would add R-wave-detection failure modes on
#     records that need none. The run record says calibration_method: none.
#   - A JSON run-record sidecar is always written beside the bank, carrying the
#     full producer config plus optional per-trace provenance. The healthy bank
#     has no sidecar — its schema carries that provenance inline.

data:
  data_dir: ../data/iafdb
  output:   ../banks/iafdb_noise_v1.h5

  # Where the sidecar goes. Omit it and the producer derives
  # <output-stem>_run_record.json beside the bank; set it when the two want
  # different names or directories.
  run_record_output: ../banks/iafdb_noise_v1_provenance.json

  # Optional stable id. Since noise_bank 1.1 it is stamped on the bank's HDF5
  # root attr *and* recorded on the sidecar, from one resolution, so the two
  # cannot disagree.
  bank_id: nbank_iafdb_quiet_p20_2026-06-27

threshold:
  mode:  percentile                        # percentile | absolute
  value: 20.0                              # 0..100; lower = quieter

windowing:
  # Shorter than the healthy side's 512 ms: the mixer tiles noise to match the
  # clean trace's length, so short source windows give more variety per record
  # without inflating the bank's row count.
  window_ms: 200.0
  hop_ms:    100.0

description: >
  IAFDB noise bank (20th percentile, 200 ms windows). Used by the
  synthetic-EGM mixer to additively color clean simulated traces.
