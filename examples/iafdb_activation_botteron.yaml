# IAFDB activation-anchored bank — the noise-robust detection chain.
#
# Same mode as iafdb_activation_windows.yaml, but every detection option set to
# its alternative, so the two files between them exercise the whole surface.
# Read iafdb_activation_windows.yaml first for what the mode does and why.
#
# The reason this configuration exists rather than being a curiosity: a
# fibrotic activation is *fractionated* — one activation made of several
# closely-spaced deflections. A sharp detection curve sees each deflection as
# its own candidate, so the refractory rule has to clean up afterwards and the
# `single_activation` flag can read multi-beat on what is physiologically one
# beat. The Botteron envelope band-passes, rectifies and low-passes first, so
# the fractionated complex arrives as a single bump and the ambiguity never
# reaches the later stages. That matters most on exactly the tissue this
# project is about.

data:
  data_dir: ../data/iafdb
  output:   ../banks/iafdb_activation_botteron.h5

format:
  type: iafdb

threshold:
  mode:  absolute
  value: 0.2

windowing:
  mode: activation

activation:
  trace_duration_ms: 192.0

  detection:
    curve: botteron_envelope
    # The envelope's own band and smoothing. The low-pass cutoff sets the
    # widest gap the smoothing bridges — raise it and a fractionated complex
    # starts splitting again; lower it and genuinely separate activations
    # start merging.
    botteron_band_hz:    [40.0, 250.0]
    botteron_lowpass_hz: 20.0

    threshold:
      # Percentile of the detection curve rather than median+MAD. Simpler to
      # reason about on a smoothed curve, whose distribution is far less
      # spiky than a rectified derivative's.
      rule: percentile
      q:    99.0

    # Require a candidate to stand this far above its surroundings. On a
    # smoothed curve the small ripples between complexes are what this
    # rejects; null (the other example) keeps every local maximum above the
    # threshold.
    min_prominence: 0.02

    refractory_ms: 50.0

    # Two-stage detection: find the complex on the smooth curve, then re-locate
    # the anchor on a sharp one within radius_ms. Gets the envelope's
    # robustness for *finding* activations and the derivative's precision for
    # *placing* them — the smoothing that merges deflections also blurs the
    # peak it reports.
    refine:
      curve:     rectified_derivative
      radius_ms: 10.0

  position:
    low:  0.4
    high: 0.6
    seed: null                             # fresh random stream each run

calibration:
  target_qrs_pp_mv: 1.0
